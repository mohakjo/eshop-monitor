services:
  # Reverse proxy devant l'application web. Le routage est déclaré dans
  # traefik/dynamic.yml (file provider) : aucun accès au socket Docker.
  traefik:
    image: traefik:v3.3
    container_name: traefik
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - "80:80" # application web
      - "8081:8080" # tableau de bord Traefik
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped
    depends_on:
      - nuxt

  nuxt:
    container_name: nuxtapp
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    # Les identifiants Umami/GlitchTip sont propres à chaque instance : ils sont
    # lus depuis .env au démarrage (voir .env.example). Sans ce fichier, les
    # valeurs par défaut de nuxt.config.ts s'appliquent.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    depends_on:
      umami:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - glitchtip-db

  glitchtip:
    image: glitchtip/glitchtip:6 # Check https://glitchtip.com/blog/ for new major versions
    depends_on:
      glitchtip-db:
        condition: service_started
      glitchtip-redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:${GLITCHTIP_DB_PASSWORD:-postgres}@glitchtip-db:5432/glitchtip
      VALKEY_URL: redis://glitchtip-redis:6379/0
      # Valeur de développement : à surcharger via .env pour tout déploiement
      # réel (`openssl rand -hex 32`).
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-8b092f41428ff7a8fd1376c4f3a7368879867139f29d58e34c2bcd4c95c00e21}
      EMAIL_URL: consolemail:// # Example smtp://email:password@smtp_url:port https://glitchtip.com/documentation/install#configuration
      GLITCHTIP_DOMAIN: http://localhost:8000 # Change this to your domain
      DEFAULT_FROM_EMAIL: email@example.com # Change this to your email
      ENABLE_USER_REGISTRATION: "True" # Nécessaire pour créer le premier compte
      ENABLE_ORGANIZATION_CREATION: "True" # Sinon l'organisation ne peut pas être créée depuis l'UI
      ENABLE_ADMIN: "False" # Set to True to enable Django Admin at /admin/
      ENABLE_OPENAPI: "False" # Set to True to enable OpenAPI spec at /api/docs
      GLITCHTIP_ENABLE_MCP: "False" # Set to True to enable MCP server
      GLITCHTIP_ENABLE_DUCKDB: "False" # Set to True to enable cold storage archival
      SERVER_ROLE: all_in_one
    restart: unless-stopped
    volumes:
      - uploads:/code/uploads

  # File d'attente des tâches de fond de GlitchTip (Valkey, fork open source
  # de Redis). Sans elle, l'ingestion des événements reste synchrone.
  glitchtip-redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  glitchtip-db:
    image: postgres:18
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-postgres}
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      # Valeur de développement : à surcharger via .env pour tout déploiement
      # réel (`openssl rand -base64 32`).
      APP_SECRET: ${UMAMI_APP_SECRET:-N09p80unIQBlVVApDkENHaLEgJfqnVuyNfuSC7IGv1g=}
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
  uploads:
  umami-db-data:
  valkey-data:
